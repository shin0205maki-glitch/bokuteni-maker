    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --ink:#18212f;
      --muted:#7a8798;

      --accent-soft:#eef2ff;
      --line:#e7ebf2;
      --success:#0f9d6e;
      --shadow:0 16px 40px rgba(26,39,64,.08);
    }
    *{box-sizing:border-box}
    body{background-image:linear-gradient(rgba(24,52,22,.20),rgba(24,52,22,.20)),url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MjAiIGhlaWdodD0iNDIwIiB2aWV3Qm94PSIwIDAgNDIwIDQyMCI+CjxkZWZzPgogIDxmaWx0ZXIgaWQ9Im4iIHg9Ii0yMCUiIHk9Ii0yMCUiIHdpZHRoPSIxNDAlIiBoZWlnaHQ9IjE0MCUiPgogICAgPGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuOSAwLjI4IiBudW1PY3RhdmVzPSI0IiBzZWVkPSIxNyIgcmVzdWx0PSJub2lzZSIvPgogICAgPGZlQ29sb3JNYXRyaXggaW49Im5vaXNlIiB0eXBlPSJtYXRyaXgiIHZhbHVlcz0iMC4xOCAwIDAgMCAwLjAyICAwIDAuNTIgMCAwIDAuMTUgIDAgMCAwLjA4IDAgMC4wMiAgMCAwIDAgMSAwIiByZXN1bHQ9ImdyYXNzIi8+CiAgICA8ZmVCbGVuZCBpbj0iU291cmNlR3JhcGhpYyIgaW4yPSJncmFzcyIgbW9kZT0ibXVsdGlwbHkiLz4KICA8L2ZpbHRlcj4KICA8bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj4KICAgIDxzdG9wIG9mZnNldD0iMCIgc3RvcC1jb2xvcj0iIzVmOGIzYyIvPgogICAgPHN0b3Agb2Zmc2V0PSIwLjQ1IiBzdG9wLWNvbG9yPSIjM2Q3MTJmIi8+CiAgICA8c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiM2YjkxM2YiLz4KICA8L2xpbmVhckdyYWRpZW50Pgo8L2RlZnM+CjxyZWN0IHdpZHRoPSI0MjAiIGhlaWdodD0iNDIwIiBmaWxsPSJ1cmwoI2cpIiBmaWx0ZXI9InVybCgjbikiLz4KPGcgb3BhY2l0eT0iLjIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiPgogIDxwYXRoIGQ9Ik0xNSA0MTBMMjYgMzU1TTQyIDQyMEw1MCAzNjZNODggNDIwTDkzIDM0OE0xMjYgNDIwTDEzOCAzNThNMTcxIDQyMEwxNzQgMzUwTTIyMCA0MjBMMjMyIDM2ME0yNjkgNDIwTDI3MiAzNDZNMzE1IDQyMEwzMjggMzYyTTM2NSA0MjBMMzcwIDM1Mk00MDUgNDIwTDQxMiAzNjUiIHN0cm9rZT0iI2I5ZDM3ZSIgc3Ryb2tlLXdpZHRoPSIyIi8+CiAgPHBhdGggZD0iTTUgNDIwTDEyIDM4ME02MyA0MjBMNjkgMzcyTTEwOSA0MjBMMTE4IDM3OE0xNTEgNDIwTDE2MCAzNzBNMTk4IDQyMEwyMDcgMzgxTTI0NSA0MjBMMjUyIDM2OU0yOTIgNDIwTDMwNCAzNzlNMzQ0IDQyMEwzNTEgMzcxTTM4OSA0MjBMMzk4IDM3OSIgc3Ryb2tlPSIjMjg0ZTIzIiBzdHJva2Utd2lkdGg9IjMiLz4KPC9nPgo8L3N2Zz4=");background-size:auto,280px 280px;background-attachment:fixed;color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    .app-shell{max-width:760px;margin:0 auto;padding:20px 14px 80px}
    .hero{padding:18px 4px 14px}
    .hero h1{font-size:clamp(1.65rem,6vw,2.4rem);font-weight:800;letter-spacing:-.04em;margin:0}
    .hero p{
      color:rgba(255,255,255,.98);
      font-weight:800;
      text-shadow:0 2px 10px rgba(0,0,0,.26);
      margin:.65rem 0 0;
      font-size:.98rem;
      line-height:1.45;
    }
    .glass-card{background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:var(--shadow)}
    .section-card{padding:18px;margin-bottom:14px}
    .section-title{font-size:.92rem;font-weight:800;letter-spacing:.02em;margin-bottom:12px}
    .conditions-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:96px;margin-bottom:8px;overflow:hidden}
    .conditions-head .section-title{margin-bottom:0;align-self:flex-start;padding-top:4px}
    .conditions-video{display:block;height:96px;width:auto;max-width:36%;object-fit:contain;object-position:center;pointer-events:none;user-select:none;flex:0 0 auto}
    .form-control,.form-select{border-radius:14px;border:1px solid var(--line);padding:.85rem .9rem;background:#fbfcfe}
    .form-control:focus,.form-select:focus{border-color:#9eb0ff;box-shadow:0 0 0 .2rem rgba(49,94,251,.12)}
    .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
    .toggle-row:last-child{border-bottom:0}
    .toggle-row small{display:block;color:var(--muted);margin-top:2px}
    .form-check-input{width:3rem!important;height:1.65rem!important;cursor:pointer}
    .form-check-input:checked{background-color:var(--accent);border-color:var(--accent)}
    .primary-btn{width:100%;border:0;border-radius:18px;padding:1rem 1.2rem;font-weight:800;font-size:1rem;background:linear-gradient(135deg,#315efb,#6f7cff);box-shadow:0 12px 26px rgba(49,94,251,.26)}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
    .summary .pill{background:#f8faff;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
    .summary .pill b{display:block;font-size:1.05rem}.summary .pill span{font-size:.72rem;color:var(--muted)}
    .round{border:1px solid var(--line);border-radius:20px;background:#fff;margin-bottom:12px;overflow:hidden}
    .round-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fbfcff;border-bottom:1px solid var(--line)}
    .round-head b{font-size:.92rem}.round-head span{color:var(--muted);font-size:.78rem}
    .court{padding:13px 14px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
    .court:last-child{border-bottom:0}.pair{display:flex;gap:7px;justify-content:center}.player{min-width:42px;text-align:center;background:var(--accent-soft);color:#243b91;border-radius:13px;padding:8px 9px;font-weight:800}.vs{font-size:.72rem;color:var(--muted);font-weight:800}

    .schedule-list{background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.9);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
    .schedule-header,.schedule-row{display:grid;grid-template-columns:70px minmax(0,1fr) 86px;align-items:center;gap:8px;padding:9px 12px}
    .schedule-header{background:#f7f9fc;border-bottom:1px solid var(--line);font-size:.72rem;font-weight:800;color:#637083;position:sticky;top:0;z-index:2}
    .schedule-row{min-height:48px;border-bottom:1px solid var(--line);font-size:.86rem}
    .schedule-row:last-child{border-bottom:0}
    .schedule-no{font-weight:800;color:#25324a}
    .schedule-match{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;font-weight:800}
    .schedule-match .mini-player{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 7px;border-radius:10px;background:var(--accent-soft);color:#243b91}
    .schedule-match .mini-vs{font-size:.7rem;color:var(--muted);font-weight:800}
    .schedule-time{text-align:right;color:var(--muted);font-size:.76rem;line-height:1.25}
    .schedule-time small{display:block;font-size:.66rem;color:#8d98a8}
    .schedule-row.after-estimate{background:rgba(248,250,255,.72)}
    @media(max-width:520px){.schedule-header,.schedule-row{grid-template-columns:56px minmax(0,1fr) 72px;padding:8px 9px;gap:5px}.schedule-match{gap:4px}.schedule-match .mini-player{min-width:27px;height:28px;padding:0 5px}.schedule-time{font-size:.7rem}}
    .estimate-line{display:flex;align-items:center;gap:10px;margin:18px 2px}.estimate-line::before,.estimate-line::after{content:"";height:2px;flex:1;background:linear-gradient(90deg,transparent,#9aa6b7)}.estimate-line::after{background:linear-gradient(90deg,#9aa6b7,transparent)}.estimate-badge{white-space:nowrap;background:#152238;color:#fff;padding:8px 12px;border-radius:999px;font-size:.78rem;font-weight:800}
    .bench{padding:0 14px 12px;color:var(--muted);font-size:.8rem}.bench b{color:#4b5563}
    .metric-card{border:1px solid var(--line);background:#fbfcfe;border-radius:18px;padding:12px}.metric-card h3{font-size:.82rem;font-weight:800;margin:0 0 8px}.metric-table{font-size:.75rem;margin:0}.metric-table td,.metric-table th{padding:.3rem .25rem;border:0}
    .matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:16px;background:#fff}
    .encounter-matrix{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%;font-size:.78rem}
    .encounter-matrix th,.encounter-matrix td{width:42px;min-width:42px;height:40px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
    .encounter-matrix thead th{position:sticky;top:0;background:#f7f9fc;font-weight:800;z-index:2}
    .encounter-matrix .row-head{position:sticky;left:0;background:#f7f9fc;font-weight:800;z-index:1}
    .encounter-matrix thead .row-head{z-index:3}
    .encounter-matrix tr:last-child th,.encounter-matrix tr:last-child td{border-bottom:0}
    .encounter-matrix th:last-child,.encounter-matrix td:last-child{border-right:0}
    .encounter-matrix .self{color:#a7b0bd;background:#fafbfc}
    .encounter-matrix .meet-0{color:#7d8897;background:#fff}
    .encounter-matrix .meet-1{background:#f1f5ff;color:#3650a0;font-weight:700}
    .encounter-matrix .meet-2{background:#e8efff;color:#2e468e;font-weight:800}
    .encounter-matrix .meet-many{background:#dce7ff;color:#233a80;font-weight:800}
    .encounter-matrix .warn{box-shadow:inset 0 0 0 2px #e16868;background:#fff0f0;color:#a13a3a}
    .matrix-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;color:var(--muted);font-size:.72rem}
    .matrix-legend span{display:inline-flex;align-items:center;gap:5px}
    .legend-dot{width:10px;height:10px;border-radius:3px;background:#fff0f0;border:2px solid #e16868}
    .empty{padding:32px 14px;text-align:center;color:var(--muted)}
    .tiny-note{font-size:.75rem;color:var(--muted);line-height:1.55}
    .danger-link{border:0;background:transparent;color:#9b4b4b;font-size:.8rem;padding:0}
    @media(max-width:520px){.summary{grid-template-columns:1fr 1fr}.summary .pill:last-child{grid-column:span 2}.court{grid-template-columns:1fr auto 1fr}.player{min-width:38px;padding:8px 6px}.section-card{padding:16px}.app-shell{padding-left:10px;padding-right:10px}}
  
    .hero{
      padding:14px 4px 10px;
      margin-bottom:8px;
    }
    .hero-inner{
      display:grid;
      grid-template-columns:minmax(0,1fr) 250px;
      gap:12px;
      align-items:end;
    }
    .hero-copy{
      min-width:0;
      padding-right:4px;
      align-self:center;
    }
    .hero-title span{display:block;white-space:nowrap}
    .hero-title{
      margin:0;
      display:flex;
      flex-direction:column;
      gap:.14em;
      font-family:"Rampart One","Noto Sans JP",sans-serif;
      font-size:clamp(2.15rem,8vw,3.2rem);
      line-height:0.9;
      letter-spacing:.01em;
      color:#ffffff;
      text-shadow:
        -1px -1px 0 rgba(20,58,22,.78),
         1px -1px 0 rgba(20,58,22,.78),
        -1px  1px 0 rgba(20,58,22,.78),
         1px  1px 0 rgba(20,58,22,.78),
         0 3px 0 rgba(20,58,22,.52),
         0 6px 14px rgba(0,0,0,.24);
      filter:drop-shadow(0 3px 8px rgba(0,0,0,.12));
    }
    .hero p{
      color:rgba(255,255,255,.98);
      font-weight:800;
      text-shadow:0 2px 10px rgba(0,0,0,.26);
      margin:.65rem 0 0;
      font-size:.98rem;
      line-height:1.45;
    }
    .hero-gif{
      width:250px;
      max-width:100%;
      height:auto;
      display:block;
      justify-self:end;
      align-self:end;
      transform:translateY(2px);
      image-rendering:auto;
      filter:drop-shadow(0 10px 18px rgba(0,0,0,.18));
      pointer-events:none;
      user-select:none;
      background:transparent;
    }
    .conditions-head,.conditions-video{
      display:none !important;
    }
    .section-card{
      padding:16px;
      margin-bottom:12px;
    }
    .summary{
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }
    .summary .pill{
      padding:8px 10px;
      border-radius:14px;
    }
    .schedule-list{
      border-radius:18px;
      overflow:hidden;
    }
    .schedule-header{
      padding:8px 12px;
      font-size:.74rem;
    }
    .schedule-row{
      grid-template-columns:58px minmax(0,1fr) 78px;
      gap:8px;
      padding:8px 12px;
      min-height:42px;
    }
    .schedule-row .sch-pairing{
      font-size:.9rem;
      font-weight:800;
      line-height:1.12;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .schedule-row .sch-time{
      font-size:.76rem;
      line-height:1.1;
    }
    .schedule-row .sch-time small{
      display:block;
      font-size:.66rem;
      margin-top:2px;
    }
    .estimate-line{
      margin:12px 0;
    }
    @media (max-width:520px){
      .hero-inner{
        grid-template-columns:minmax(0,1fr) 190px;
        gap:8px;
        align-items:end;
      }
      .hero-title{
        font-size:clamp(1.95rem,8.2vw,2.7rem);
      }
      .hero p{
        font-size:.86rem;
        line-height:1.35;
      }
      .hero-gif{
        width:190px;
      }
      .schedule-row{
        grid-template-columns:54px minmax(0,1fr) 72px;
        gap:6px;
        padding:7px 10px;
      }
      .schedule-row .sch-pairing{
        font-size:.83rem;
      }
      .schedule-row .sch-time{
        font-size:.72rem;
      }
    }

  </style>
</head>

  const $ = id => document.getElementById(id);
  const els = {courts:$('courts'),players:$('players'),duration:$('duration'),matchMinutes:$('matchMinutes'),swGames:$('swGames'),swMeet:$('swMeet'),swGap:$('swGap'),generateBtn:$('generateBtn'),output:$('output')};

  const SETTINGS_KEY='tennisPlannerSettings.v01';
  const saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');
  if(saved){ for(const k of ['courts','players','duration','matchMinutes']) if(saved[k]!=null) els[k].value=saved[k]; for(const k of ['swGames','swMeet','swGap']) if(saved[k]!=null) els[k].checked=!!saved[k]; }
  function persist(){ localStorage.setItem(SETTINGS_KEY,JSON.stringify({courts:els.courts.value,players:els.players.value,duration:els.duration.value,matchMinutes:els.matchMinutes.value,swGames:els.swGames.checked,swMeet:els.swMeet.checked,swGap:els.swGap.checked})); }
  document.querySelectorAll('input,select').forEach(x=>x.addEventListener('change',persist));

  function combinations(arr,k){
    const out=[];
    function rec(start,cur){ if(cur.length===k){out.push(cur.slice()); return;} for(let i=start;i<=arr.length-(k-cur.length);i++){cur.push(arr[i]);rec(i+1,cur);cur.pop();} }
    rec(0,[]); return out;
  }
  const key2=(a,b)=>a<b?`${a}-${b}`:`${b}-${a}`;
  const keyTeam=(a,b)=>key2(a,b);

  function patternConfig(flags){
    const key=`${flags.games?1:0}${flags.meet?1:0}${flags.gap?1:0}`;
    const configs={
      '100':{name:'試合数',encounterCap:2,priorities:['games']},
      '110':{name:'試合数 → 組み合わせ',encounterCap:3,priorities:['games','meet']},
      '111':{name:'試合数 → 組み合わせ → 試合間隔',encounterCap:2,priorities:['games','meet','gap']},
      '101':{name:'試合数 → 試合間隔',encounterCap:2,priorities:['games','gap']},
      '011':{name:'組み合わせ → 試合間隔',encounterCap:2,priorities:['meet','gap']},
      '010':{name:'組み合わせ',encounterCap:2,priorities:['meet']},
      '001':{name:'試合間隔',encounterCap:2,priorities:['gap']},
      '000':{name:'ランダム分散',encounterCap:2,priorities:[]}
    };
    return configs[key];
  }

  function encounterCapForFlags(flags){
    return patternConfig(flags).encounterCap;
  }

  function cloneState(state){
    return {games:state.games.slice(),lastRound:state.lastRound.slice(),meets:{...state.meets},partners:{...state.partners}};
  }

  function shuffle(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function playerWait(p,state,round){
    return state.lastRound[p]===0 ? round-1 : Math.max(0,round-state.lastRound[p]-1);
  }

  function projectedEncounterSpread(player,group,state){
    const vals=[];
    for(let q=1;q<state.games.length;q++) if(q!==player){
      let c=state.meets[key2(player,q)]||0;
      if(group.includes(q)) c++;
      vals.push(c);
    }
    return Math.max(...vals)-Math.min(...vals);
  }

  function groupWithinEncounterCap(group,state,cap){
    return group.every(p=>projectedEncounterSpread(p,group,state)<=cap);
  }

  function groupsWithinEncounterCap(groups,state,cap){
    return groups.every(g=>groupWithinEncounterCap(g,state,cap));
  }

  function projectedGameMetrics(groups,state){
    const selected=new Set(groups.flat());
    const counts=[];
    for(let p=1;p<state.games.length;p++) counts.push(state.games[p]+(selected.has(p)?1:0));
    const min=Math.min(...counts),max=Math.max(...counts);
    const mean=counts.reduce((a,b)=>a+b,0)/counts.length;
    const varianceSum=counts.reduce((sum,v)=>sum+(v-mean)*(v-mean),0);
    return {spread:max-min,varianceSum};
  }

  function projectedMeetMetrics(groups,state){
    const groupOf=new Map();
    groups.forEach((g,idx)=>g.forEach(p=>groupOf.set(p,idx)));
    let maxSpread=0,excessOne=0,spreadSum=0,repeatSum=0;

    for(const g of groups){
      for(let i=0;i<g.length;i++) for(let j=i+1;j<g.length;j++){
        repeatSum+=state.meets[key2(g[i],g[j])]||0;
      }
    }

    for(let p=1;p<state.games.length;p++){
      const vals=[];
      for(let q=1;q<state.games.length;q++) if(q!==p){
        let c=state.meets[key2(p,q)]||0;
        if(groupOf.has(p) && groupOf.get(p)===groupOf.get(q)) c++;
        vals.push(c);
      }
      const spread=Math.max(...vals)-Math.min(...vals);
      maxSpread=Math.max(maxSpread,spread);
      excessOne+=Math.max(0,spread-1);
      spreadSum+=spread;
    }
    return {maxSpread,excessOne,spreadSum,repeatSum};
  }

  function projectedGapMetrics(groups,state,round){
    const selected=new Set(groups.flat());
    let consecutive=0,maxWaitAfter=0,waitSquare=0;
    for(let p=1;p<state.games.length;p++){
      if(selected.has(p)){
        if(state.lastRound[p]===round-1) consecutive++;
      }else{
        const wait=state.lastRound[p]===0 ? round : Math.max(0,round-state.lastRound[p]);
        maxWaitAfter=Math.max(maxWaitAfter,wait);
        waitSquare+=wait*wait;
      }
    }
    return {maxWaitAfter,consecutive,waitSquare};
  }

  function roundPlanScore(groups,state,round,flags){
    const score=[];
    let meetMetrics=null;

    // 有効なスイッチの優先順位は必ず「試合数 → 組み合わせ → 試合間隔」。
    if(flags.games){
      const gm=projectedGameMetrics(groups,state);
      score.push(gm.spread,gm.varianceSum);
    }
    if(flags.meet){
      meetMetrics=projectedMeetMetrics(groups,state);
      score.push(meetMetrics.maxSpread,meetMetrics.excessOne,meetMetrics.spreadSum,meetMetrics.repeatSum);
    }else{
      // 組み合わせOFFでも「遭遇差上限」は常時ハード制約。
      // 後半で詰まらないための安全余力だけは、試合間隔より先に確認する。
      meetMetrics=projectedMeetMetrics(groups,state);
      score.push(meetMetrics.maxSpread,meetMetrics.excessOne,meetMetrics.repeatSum);
    }
    if(flags.gap){
      const gap=projectedGapMetrics(groups,state,round);
      score.push(gap.maxWaitAfter,gap.consecutive,gap.waitSquare);
    }
    score.push(Math.random());
    return score;
  }

  function cmpScore(a,b){
    for(let i=0;i<Math.min(a.length,b.length);i++){
      if(a[i]<b[i])return-1;
      if(a[i]>b[i])return 1;
    }
    return a.length-b.length;
  }

  function fairActiveSets(playerIds,state,slots,limit=180){
    const tiers=new Map();
    for(const p of playerIds){
      const g=state.games[p];
      if(!tiers.has(g)) tiers.set(g,[]);
      tiers.get(g).push(p);
    }
    const counts=[...tiers.keys()].sort((a,b)=>a-b);
    const fixed=[];
    let boundary=[],need=0;
    for(const count of counts){
      const tier=tiers.get(count);
      if(fixed.length+tier.length<=slots){
        fixed.push(...tier);
        if(fixed.length===slots) return [fixed.slice()];
      }else{
        boundary=tier.slice();
        need=slots-fixed.length;
        break;
      }
    }
    if(need<=0) return [fixed.slice(0,slots)];

    let picks=[];
    if(boundary.length<=18){
      picks=combinations(boundary,need);
      if(picks.length>limit) picks=shuffle(picks).slice(0,limit);
    }else{
      const seen=new Set();
      const attempts=limit*8;
      for(let i=0;i<attempts && picks.length<limit;i++){
        const pick=shuffle(boundary).slice(0,need).sort((a,b)=>a-b);
        const key=pick.join('-');
        if(!seen.has(key)){seen.add(key);picks.push(pick);}
      }
    }
    return picks.map(pick=>fixed.concat(pick));
  }

  function groupPartitions(selected,courtCount,limit=240){
    if(courtCount===1) return [[selected.slice()]];
    if(courtCount===2 && selected.length===8){
      const anchor=selected[0];
      const rest=selected.slice(1);
      const out=[];
      for(const three of combinations(rest,3)){
        const g1=[anchor,...three];
        const set1=new Set(g1);
        const g2=selected.filter(p=>!set1.has(p));
        out.push([g1,g2]);
      }
      return out;
    }
    const out=[],seen=new Set();
    for(let i=0;i<limit*4 && out.length<limit;i++){
      const order=shuffle(selected);
      const groups=[];
      for(let c=0;c<courtCount;c++) groups.push(order.slice(c*4,c*4+4));
      const key=groups.map(g=>g.slice().sort((a,b)=>a-b).join('-')).sort().join('|');
      if(!seen.has(key)){seen.add(key);out.push(groups);}
    }
    return out;
  }

  function chooseFairGameRound(playerIds,courtCount,state,round,flags,encounterCap){
    const slots=courtCount*4;
    const activeSets=fairActiveSets(playerIds,state,slots,180);
    let best=null,bestScore=null;
    for(const selected of activeSets){
      for(const groups of groupPartitions(selected,courtCount,220)){
        if(!groupsWithinEncounterCap(groups,state,encounterCap)) continue;
        const score=roundPlanScore(groups,state,round,flags);
        if(bestScore===null || cmpScore(score,bestScore)<0){best=groups;bestScore=score;}
      }
    }
    return best;
  }

  function buildCandidateGroups(playerIds,courtCount,state,round,flags,trial){
    const perRound=courtCount*4;
    const ranked=playerIds.map(p=>({p,r:Math.random()}));
    const exploratory=(trial%10)>=7; // 30%は制約衝突を避けるため候補を広く探索

    if(!exploratory){
      ranked.sort((a,b)=>{
        if(flags.games && state.games[a.p]!==state.games[b.p]) return state.games[a.p]-state.games[b.p];

        // 組み合わせOFFなら、同じ試合数の中で待ちが長い人を先に候補化できる。
        // 組み合わせONなら遭遇評価の方が先なので、同順位はランダム化する。
        if(flags.gap && !flags.meet){
          const wa=playerWait(a.p,state,round),wb=playerWait(b.p,state,round);
          if(wa!==wb) return wb-wa;
        }
        return a.r-b.r;
      });
    }else{
      ranked.sort((a,b)=>a.r-b.r);
    }

    const selected=ranked.slice(0,perRound).map(x=>x.p);
    const shuffled=shuffle(selected);
    const groups=[];
    for(let c=0;c<courtCount;c++) groups.push(shuffled.slice(c*4,c*4+4));
    return groups;
  }

  function chooseRoundGroups(playerIds,courtCount,state,round,flags,encounterCap){
    // 試合数ONは、まず全員の試合数差が最小になる出場者集合だけを候補にする。
    // その集合の中で、後続の優先項目と遭遇上限を満たすコート分けを選ぶ。
    if(flags.games){
      const fair=chooseFairGameRound(playerIds,courtCount,state,round,flags,encounterCap);
      if(fair) return fair;
    }

    // 試合数OFF、または厳密な試合数均等候補では遭遇上限を維持できない場合の探索。
    // 4人ごとの局所最適ではなく、全コート・全参加者の状態で比較する。
    let best=null,bestScore=null;
    const baseTrials=playerIds.length<=20 ? (flags.meet?1500:900) : (flags.meet?900:600);

    for(let t=0;t<baseTrials;t++){
      const groups=buildCandidateGroups(playerIds,courtCount,state,round,flags,t);
      if(groups.some(g=>g.length<4)) continue;
      if(!groupsWithinEncounterCap(groups,state,encounterCap)) continue;
      const score=roundPlanScore(groups,state,round,flags);
      if(bestScore===null || cmpScore(score,bestScore)<0){best=groups;bestScore=score;}
    }

    if(!best){
      for(let t=0;t<3000;t++){
        const groups=buildCandidateGroups(playerIds,courtCount,state,round,flags,t+baseTrials);
        if(groups.some(g=>g.length<4)) continue;
        if(!groupsWithinEncounterCap(groups,state,encounterCap)) continue;
        const score=roundPlanScore(groups,state,round,flags);
        if(bestScore===null || cmpScore(score,bestScore)<0){best=groups;bestScore=score;}
      }
    }
    return best;
  }

  function bestPairing(group,state){
    const [a,b,c,d]=group;
    const options=[[[a,b],[c,d]],[[a,c],[b,d]],[[a,d],[b,c]]];
    let best=null,bestScore=null;

    // 4人の選出とは完全に分離し、スイッチ状態に関係なく毎試合ペア履歴を評価する。
    // 「同じペアになった最大回数」→「2ペアの重複合計」の順で最小化する。
    for(const opt of options){
      const counts=opt.map(team=>state.partners[keyTeam(...team)]||0);
      const score=[Math.max(...counts),counts[0]+counts[1]];
      if(bestScore===null || cmpScore(score,bestScore)<0){bestScore=score;best=opt;}
    }
    return best;
  }

  function generateScheduleAttempt(n,courts,duration,matchMinutes,flags){
    const config=patternConfig(flags);
    const encounterCap=config.encounterCap;
    const playerIds=Array.from({length:n},(_,i)=>i+1);
    const activeCourts=Math.min(courts,Math.floor(n/4));
    const perRound=activeCourts*4;
    if(activeCourts<1) throw new Error('4人以上必要です。');
    const targetRounds=Math.max(1,Math.floor(duration/matchMinutes));
    const targetMatches=targetRounds*activeCourts;
    const extraMatches=Math.max(1,Math.ceil(targetMatches*0.20));
    const totalMatches=targetMatches+extraMatches;
    const totalRounds=Math.ceil(totalMatches/activeCourts);

    const state={games:Array(n+1).fill(0),lastRound:Array(n+1).fill(0),meets:{},partners:{}};
    const rounds=[];
    const firstPassRounds=Math.ceil(n/perRound);
    let firstTimerCursor=0;
    let targetState=null;

    for(let r=1;r<=totalRounds;r++){
      const available=playerIds.slice();
      let chosen=[];
      const isFirstPassRound=r<=firstPassRounds;
      const remainingMatches=totalMatches-(r-1)*activeCourts;
      const courtCount=Math.min(activeCourts,remainingMatches);

      // 全員が最初の1試合に入るまでは「誰をコートに入れるか」だけ番号順で固定。
      // ペア分けはこの期間も bestPairing() で履歴分散する。
      if(isFirstPassRound){
        const ordered=[];
        while(ordered.length<perRound && firstTimerCursor<n){
          ordered.push(playerIds[firstTimerCursor]);
          firstTimerCursor++;
        }
        if(ordered.length<perRound){
          for(const p of playerIds){
            if(ordered.length>=perRound) break;
            if(!ordered.includes(p)) ordered.push(p);
          }
        }
        for(let c=0;c<courtCount;c++){
          const g=ordered.slice(c*4,c*4+4);
          if(g.length<4) break;
          if(!groupWithinEncounterCap(g,state,encounterCap)){
            throw new Error(`初回の番号順配置では遭遇回数差の上限${encounterCap}を維持できません。`);
          }
          chosen.push(g);
        }
      }else{
        chosen=chooseRoundGroups(playerIds,courtCount,state,r,flags,encounterCap);
        if(!chosen){
          throw new Error(`遭遇回数差の上限${encounterCap}を守れる組み合わせが見つかりませんでした。`);
        }
      }

      const playing=new Set(chosen.flat());
      for(let i=available.length-1;i>=0;i--) if(playing.has(available[i])) available.splice(i,1);

      const courtsData=[];
      for(const g of chosen){
        const pairing=bestPairing(g,state);
        courtsData.push({group:g.slice(),pairing});
        for(const p of g){state.games[p]++;state.lastRound[p]=r;}
        for(let i=0;i<g.length;i++) for(let j=i+1;j<g.length;j++){
          const k=key2(g[i],g[j]);state.meets[k]=(state.meets[k]||0)+1;
        }
        for(const team of pairing){const k=keyTeam(...team);state.partners[k]=(state.partners[k]||0)+1;}
      }
      rounds.push({round:r,courts:courtsData,bench:available.slice()});
      if(r===targetRounds) targetState=cloneState(state);
    }

    return {rounds,targetRounds,totalRounds,targetMatches,extraMatches,totalMatches,state,targetState:targetState||cloneState(state),activeCourts,perRound,encounterCap,patternName:config.name};
  }

  function generateSchedule(n,courts,duration,matchMinutes,flags){
    let lastError=null;
    const maxAttempts=6;
    for(let attempt=0;attempt<maxAttempts;attempt++){
      try{return generateScheduleAttempt(n,courts,duration,matchMinutes,flags);}catch(err){lastError=err;}
    }
    throw lastError || new Error('組み合わせを生成できませんでした。');
  }

  function statsHtml(result,n){
    const state=result.targetState;
    const counts=[];for(let p=1;p<=n;p++)counts.push(state.games[p]);
    const min=Math.min(...counts),max=Math.max(...counts);
    let worstMeetSpread=0;
    for(let p=1;p<=n;p++){
      const vals=[];for(let q=1;q<=n;q++)if(q!==p)vals.push(state.meets[key2(p,q)]||0);
      worstMeetSpread=Math.max(worstMeetSpread,Math.max(...vals)-Math.min(...vals));
    }
    return `<div class="summary">
      <div class="pill"><b>${result.targetMatches}</b><span>目安試合数</span></div>
      <div class="pill"><b>${min}〜${max}</b><span>目安時間内の各人試合数</span></div>
      <div class="pill"><b>${worstMeetSpread}</b><span>最大遭遇回数差（許容${result.encounterCap}）</span></div>
    </div>`;
  }

  function encounterMatrixHtml(result,n){
    const matrixState=result.targetState;
    const rowMins=Array(n+1).fill(0);
    const rowMaxs=Array(n+1).fill(0);
    for(let p=1;p<=n;p++){
      const vals=[];
      for(let q=1;q<=n;q++) if(q!==p) vals.push(matrixState.meets[key2(p,q)]||0);
      rowMins[p]=Math.min(...vals);
      rowMaxs[p]=Math.max(...vals);
    }

    let html='<section class="glass-card section-card mt-3"><div class="section-title">遭遇数マトリクス（目安時間内）</div>';
    html+='<div class="tiny-note mb-2">同じ試合の4人に入った回数です。ペア・対戦相手を区別せず「遭遇」として数えます。</div>';
    html+='<div class="matrix-wrap"><table class="encounter-matrix"><thead><tr><th class="row-head">#</th>';
    for(let q=1;q<=n;q++) html+=`<th>${q}</th>`;
    html+='</tr></thead><tbody>';

    for(let p=1;p<=n;p++){
      html+=`<tr><th class="row-head">${p}</th>`;
      for(let q=1;q<=n;q++){
        if(p===q){html+='<td class="self">—</td>';continue;}
        const c=matrixState.meets[key2(p,q)]||0;
        const base=c===0?'meet-0':c===1?'meet-1':c===2?'meet-2':'meet-many';
        const warn=(rowMaxs[p]-rowMins[p]>result.encounterCap && c-rowMins[p]>result.encounterCap)?' warn':'';
        html+=`<td class="${base}${warn}" title="${p}番と${q}番：${c}回">${c}</td>`;
      }
      html+='</tr>';
    }
    html+='</tbody></table></div>';
    html+=`<div class="matrix-legend"><span><i class="legend-dot"></i>赤枠：遭遇差の許容上限${result.encounterCap}を超えた相手</span></div>`;
    html+='</section>';
    return html;
  }

  function render(){
    persist();
    const n=parseInt(els.players.value,10), courts=parseInt(els.courts.value,10), duration=parseInt(els.duration.value,10), mm=parseInt(els.matchMinutes.value,10);
    if(!Number.isFinite(n)||n<4){els.output.innerHTML='<div class="glass-card empty">参加人数は4人以上にしてください。</div>';return;}
    const flags={games:els.swGames.checked,meet:els.swMeet.checked,gap:els.swGap.checked};
    let result;
    try{
      result=generateSchedule(n,courts,duration,mm,flags);
    }catch(err){
      els.output.innerHTML=`<div class="glass-card section-card"><div class="section-title">生成できませんでした</div><div class="tiny-note">${err.message}</div></div>`;
      return;
    }
    let html=`<section class="glass-card section-card"><div class="section-title">今日の予定</div>${statsHtml(result,n)}<div class="tiny-note mt-3">番号は参加者番号です。目安時間以降も予備として約20%分（${result.extraMatches}試合）を続けて表示します。</div></section>`;
    html+=`<div class="schedule-list"><div class="schedule-header"><div>試合数</div><div class="text-center">組み合わせ</div><div class="text-end">経過時間</div></div>`;
    let matchNo=0;
    result.rounds.forEach((r)=>{
      r.courts.forEach((c,i)=>{
        matchNo++;
        const [t1,t2]=c.pairing;
        const after=matchNo>result.targetMatches?' after-estimate':'';
        html+=`<div class="schedule-row${after}"><div class="schedule-no">試合 ${matchNo}</div><div class="schedule-match"><span class="mini-player">${t1[0]}</span><span class="mini-player">${t1[1]}</span><span class="mini-vs">VS</span><span class="mini-player">${t2[0]}</span><span class="mini-player">${t2[1]}</span></div><div class="schedule-time">${mm*(r.round-1)}〜${mm*r.round}分<small>C${i+1}</small></div></div>`;
        if(matchNo===result.targetMatches){
          html+=`</div><div class="estimate-line"><span class="estimate-badge">${duration/60%1===0?duration/60+'時間':Math.floor(duration/60)+'時間'+duration%60+'分'}なら、ここまでが目安</span></div><div class="schedule-list"><div class="schedule-header"><div>試合数</div><div class="text-center">組み合わせ</div><div class="text-end">経過時間</div></div>`;
        }
      });
    });
    html+='</div>';
    html+=encounterMatrixHtml(result,n);
    html+=`<section class="glass-card section-card mt-3"><div class="section-title">メモ</div><div class="tiny-note">このv0.9は試作版です。全参加者が最初の1試合に入るまでは、初出場者を番号順に配置します。端数の空き枠は、すでに出場した小さい番号から順に補い、全員が1試合を終えた後から優先条件に沿って最適化します。表示はラウンド分けせず、試合1・試合2…の通し番号です。目安時間の後にも約20%分の予備試合を設定します。8通りのスイッチ状態を個別ルールとして固定しています。試合数ONでは全参加者の累積試合数差を最優先で最小化し、組み合わせONでは遭遇差1以内を目標にし、試合間隔ONでは連続出場と長い待ちを減らします。遭遇差の最大許容は原則2です。「試合数ON・組み合わせON・試合間隔OFF」のときだけ最大3を許容します。上限を維持できない組み合わせは採用しません。</div></section>`;
    els.output.innerHTML=html;
    els.output.scrollIntoView({behavior:'smooth',block:'start'});
  }
  els.generateBtn.addEventListener('click',render);
})();
</script>
